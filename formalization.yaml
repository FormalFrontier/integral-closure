fidelity:
  divergences: >-
    Vakil's cited exercise presents a finite-extension forward implication and
    asks whether finiteness is needed; the library's field-extension theorem
    omits finiteness, algebraicity and separability. The independent generic
    retraction theorem is an original generalization, not a book excerpt.
    The henselian locality theorem allows non-domain base rings, beyond the
    valuation-ring setting of Fesenko and Vostokov; its ring-homomorphism form
    preserves the given structural map without an injectivity assumption.
review:
  status: "other: independently reviewed"
  notes: >-
    Independent review covers the mathematical code, ordinary-import examples
    and documentation.
acknowledgements: >-
  Uses mathlib as a declared dependency. Vakil's book is cited only for the
  mathematical question, not as a formalization author or licensed project asset.
  Henselian locality reuses the monic coprime-factor lifting theorem from
  Formal Frontier's Adic Modules library.
highlights:
  - title: Integral domains over henselian local rings are local
    statement: A nonzero commutative domain integral over a commutative henselian local ring is local, without injectivity or module-finiteness assumptions.
    declarations:
      - declaration: HenselianLocalRing.isLocalRing_of_isIntegral
        file: IntegralClosure/Henselian.lean
      - declaration: RingHom.isLocalRing_of_henselian_of_isIntegral
        file: IntegralClosure/Henselian.lean
  - title: Integral closedness descends along linear retractions
    statement: An injective algebra map into an integrally closed domain with a linear left inverse gives integral closedness of its source.
    declarations:
      - declaration: IsIntegrallyClosed.of_linearRetract
        file: IntegralClosure/LinearRetract.lean
  - title: Normal-domain descent from arbitrary field scalar extensions
    statement: If scalar extension of a commutative algebra by any field extension is an integrally closed domain, then the original algebra is an integrally closed domain.
    declarations:
      - declaration: Algebra.TensorProduct.isDomain_left
        file: IntegralClosure/TensorProduct.lean
      - declaration: Algebra.TensorProduct.isIntegrallyClosed_left
        file: IntegralClosure/TensorProduct.lean
  - title: Prime-spectrum embeddings from powers in the image
    statement: A homomorphism of commutative semirings for which each target element has a positive power in its image induces a topological embedding on prime spectra.
    declarations:
      - declaration: PrimeSpectrum.isEmbedding_comap_of_forall_pow_mem_range
        file: IntegralClosure/Spectrum/Topology.lean
