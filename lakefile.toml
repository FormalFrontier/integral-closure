name = "integral-closure"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["IntegralClosure", "IntegralClosureTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "IntegralClosure"

[[lean_lib]]
name = "IntegralClosureTest"
roots = ["IntegralClosureTest.LeafClient", "IntegralClosureTest.RootClient",
         "IntegralClosureTest.ReadmeLinearRetract", "IntegralClosureTest.ReadmeTensorProduct",
         "IntegralClosureTest.Jacobson", "IntegralClosureTest.PowerReflection"]

[lean_lib.leanOptions]
weak.linter.privateModule = false
