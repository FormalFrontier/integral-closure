version: "v0.4"
project:
  name: integral-closure
  description: >-
    Integral-closure descent along linear retractions and normal-domain descent
    from arbitrary field scalar extensions of commutative algebras, with power
    criteria for integrality, finiteness and prime-spectrum embeddings, and
    locality of integral domains integral over henselian local rings.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Integral-closure descent along linear retractions and arbitrary field scalar extensions
    type: original-proof
    relationship: formalizes
    note: >-
      Atlas contributed the initial descent proofs and declarations.
      Other Formal Frontier contributors developed further mathematical results,
      module interfaces and examples.
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - Ravi Vakil
    type: book
    location: "October 21, 2025 draft, Exercise 5.4.M, physical/PDF page 169"
    relationship: background
    note: >-
      Mathematical motivation: the exercise asks whether finiteness is needed
      for a forward normal-domain implication. This formalization proves descent
      for arbitrary field extensions. The book is not a project-licensed asset,
      a proof contributor, or an endorsement of this formalization.
  - title: Local Fields and Their Extensions
    authors:
      - I. B. Fesenko
      - S. V. Vostokov
    type: book
    location: "Second edition, 2002"
    relationship: background
    note: >-
      The henselian locality theorem generalizes the valuation-ring setting to
      commutative henselian local base rings that may have zero divisors.
      No book excerpts or redistribution license are included.
automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents used Lean and mathlib with reviewed project
        contributions, ordinary imports and pinned toolchain/dependency revisions.
  notes: >-
    Atlas contributed the initial descent proofs; other Formal Frontier
    contributors developed the later mathematics, module interfaces and
    examples. Folio contributed the initial README headlines.
    No model, cost or performance measurements are reported here.
status:
  scope: >-
    An A-linear retraction of an injective algebra map into an integrally closed
    domain descends integral closedness; domain and integral-closure descent from
    an arbitrary field extension are separate results. No ascent, converse,
    normalization or whole-source formalization is claimed. For a homomorphism
    of commutative semirings, positive powers in its image give a topological
    embedding on prime spectra, without requiring the homomorphism to be
    surjective. This extends the surjective criterion, not all localization
    embeddings; no closed-range or spectral-surjectivity assertion is made.
    A nonzero domain integral over a henselian local ring is local, without
    assuming the base is a domain, the structural map injective, or the
    extension finite as a module.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: HenselianLocalRing.isLocalRing_of_isIntegral
      file: IntegralClosure/Henselian.lean
      sorry_count: 0
    - declaration: RingHom.isLocalRing_of_henselian_of_isIntegral
      file: IntegralClosure/Henselian.lean
      sorry_count: 0
    - declaration: PrimeSpectrum.comap_isInducing_of_forall_pow_mem_range
      file: IntegralClosure/Spectrum/Topology.lean
      sorry_count: 0
    - declaration: PrimeSpectrum.isEmbedding_comap_of_forall_pow_mem_range
      file: IntegralClosure/Spectrum/Topology.lean
      sorry_count: 0
    - declaration: PrimeSpectrum.comap_injective_of_forall_pow_mem_range
      file: IntegralClosure/Spectrum.lean
      sorry_count: 0
    - declaration: IsIntegrallyClosed.of_linearRetract
      file: IntegralClosure/LinearRetract.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: Algebra.TensorProduct.rightLinearMap
      file: IntegralClosure/TensorProduct.lean
      axioms: [propext, Quot.sound]
    - declaration: Algebra.TensorProduct.rightLinearMap_includeLeft
      file: IntegralClosure/TensorProduct.lean
      sorry_count: 0
