name = "integral-closure"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["IntegralClosure", "IntegralClosureTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "4791da691c8cf6f7bf40caf2606e17e46b432e08"

[[require]]
name = "adic-modules"
git = "https://github.com/FormalFrontier/adic-modules.git"
rev = "2fb498d13a8195ddd32e0462f7983828f61aece1"

[[lean_lib]]
name = "IntegralClosure"
roots = ["IntegralClosure", "IntegralClosure.Henselian"]

[[lean_lib]]
name = "IntegralClosureTest"
roots = ["IntegralClosureTest.LeafClient", "IntegralClosureTest.RootClient",
         "IntegralClosureTest.ReadmeLinearRetract", "IntegralClosureTest.ReadmeTensorProduct",
         "IntegralClosureTest.Jacobson", "IntegralClosureTest.PowerReflection",
         "IntegralClosureTest.Spectrum", "IntegralClosureTest.SpectrumTopology"]

[lean_lib.leanOptions]
weak.linter.privateModule = false
